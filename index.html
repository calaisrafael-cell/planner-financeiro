<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planner de Gastos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231D9E75'/%3E%3Cpath d='M7 23V11M11 23V15M16 23V9M21 23V15M25 23V18' stroke='white' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
button,input,select{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
:root{
  --bg:#F3F2EE; --surface:#FFF; --sidebar:#111110; --sidebar-hover:#1C1C1A;
  --sidebar-active:rgba(29,158,117,0.13); --accent:#1D9E75; --accent-dark:#0F6E56;
  --accent-bg:#E1F5EE; --text-1:#18180F; --text-2:#67665E; --text-3:#9B9A92;
  --border:rgba(24,24,15,0.08); --border-md:rgba(24,24,15,0.14);
  --danger:#B83232; --warning:#A05E0C; --safe:#1D9E75;
  --num:'DM Mono',monospace;
  --r-sm:6px; --r-md:9px; --r-lg:13px;
  --sidebar-w:220px; --header-h:56px;
}

/* ── BASE ── */
html{height:100%;height:-webkit-fill-available;}
body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-1);font-size:14px;
  display:flex;height:100vh;height:100dvh;overflow:hidden;
}

/* ── SIDEBAR ── */
.sidebar{width:var(--sidebar-w);height:100%;background:var(--sidebar);display:flex;flex-direction:column;flex-shrink:0;}
.sb-logo{padding:16px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;gap:10px;}
.sb-logo-img{width:28px;height:19px;flex-shrink:0;color:#9FE1CB;}
.sb-logo-img svg{width:100%;height:100%;}
.sb-logo-text h1{font-size:13px;font-weight:500;color:#EDECEA;letter-spacing:-0.01em;}
.sb-logo-text p{font-size:11px;color:#525250;margin-top:2px;}
.sb-section{font-size:10px;font-weight:500;color:#404040;letter-spacing:0.08em;text-transform:uppercase;padding:14px 16px 5px;}
.month-list{flex:1;overflow-y:auto;padding:0 7px 7px;}
.month-list::-webkit-scrollbar{width:3px;}
.month-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:99px;}
.m-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-md);cursor:pointer;transition:background 0.12s;margin-bottom:1px;}
.m-item:hover{background:var(--sidebar-hover);}
.m-item.active{background:var(--sidebar-active);}
.m-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:0;flex-shrink:0;}
.m-item.active .m-dot{opacity:1;}
.m-name{flex:1;font-size:12.5px;color:#A0A09A;}
.m-item.active .m-name{color:#9FE1CB;font-weight:500;}
.m-del{opacity:0;transition:opacity 0.12s;width:22px;height:22px;border-radius:5px;border:none;background:transparent;color:#505050;display:flex;align-items:center;justify-content:center;}
.m-del:hover{background:rgba(184,50,50,0.2);color:#F09595;}
.m-item:hover .m-del{opacity:1;}
.sb-footer{padding:9px 7px;border-top:1px solid rgba(255,255,255,0.05);display:flex;flex-direction:column;gap:2px;}
.sb-btn{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-md);background:transparent;border:none;color:#686864;font-size:12.5px;transition:background 0.12s,color 0.12s;width:100%;text-align:left;}
.sb-btn:hover{background:var(--sidebar-hover);color:#A0A09A;}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}

/* ── DESKTOP HEADER ── */
.header{height:var(--header-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;}
.hdr-month{font-size:16px;font-weight:500;letter-spacing:-0.02em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hdr-sync{width:8px;height:8px;border-radius:50%;background:#888;transition:background 0.3s;flex-shrink:0;cursor:default;}
.sal-group{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.sal-group label{font-size:12px;color:var(--text-2);white-space:nowrap;}
.sal-wrap{position:relative;}
.sal-wrap span{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--text-3);font-family:var(--num);pointer-events:none;}
.sal-wrap input{padding:6px 8px 6px 26px;border:1px solid var(--border-md);border-radius:var(--r-md);font-size:14px;font-family:var(--num);font-weight:500;width:130px;background:var(--bg);color:var(--text-1);transition:border-color 0.15s;}
.sal-wrap input:focus{outline:none;border-color:var(--accent);}

/* ── MOBILE HEADER ── */
.mob-header{display:none;height:52px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;padding:0 14px;gap:8px;flex-shrink:0;}
.mob-hdr-left{display:flex;align-items:center;gap:8px;flex:1;min-width:0;overflow:hidden;}
.mob-hdr-right{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.mob-logo{width:22px;height:15px;color:var(--accent);flex-shrink:0;}
.mob-logo svg{width:100%;height:100%;}
.mob-month-btn{display:flex;align-items:center;gap:4px;background:transparent;border:none;text-align:left;padding:5px 8px;border-radius:var(--r-md);min-width:0;transition:background 0.12s;max-width:160px;}
.mob-month-btn:hover{background:var(--bg);}
.mob-month-name{font-size:13.5px;font-weight:500;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mob-month-empty{font-size:13px;color:var(--text-3);padding:5px 8px;}
.mob-chev{color:var(--text-3);flex-shrink:0;}
.mob-ico-btn{width:36px;height:36px;border-radius:var(--r-md);border:1px solid var(--border-md);background:transparent;color:var(--text-2);display:flex;align-items:center;justify-content:center;transition:background 0.12s,color 0.12s;flex-shrink:0;}
.mob-ico-btn:hover{background:var(--bg);}
.mob-ico-btn.accent{background:var(--accent);color:white;border-color:var(--accent);}
.mob-ico-btn.accent:hover{background:var(--accent-dark);}
.mob-sync{width:7px;height:7px;border-radius:50%;background:#888;transition:background 0.3s;flex-shrink:0;margin-left:2px;}
/* Mobile salary bar */
.sal-bar{display:none;align-items:center;gap:10px;padding:9px 14px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;}
.sal-bar label{font-size:12px;color:var(--text-2);white-space:nowrap;flex-shrink:0;}
.sal-bar .sal-wrap{flex:1;}
.sal-bar .sal-wrap input{width:100%;padding:6px 8px 6px 26px;border:1px solid var(--border-md);border-radius:var(--r-md);font-size:14px;font-family:var(--num);font-weight:500;background:var(--bg);color:var(--text-1);}
.sal-bar .sal-wrap input:focus{outline:none;border-color:var(--accent);}

/* ── MES SHEET (mobile overlay) ── */
.mes-sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:80;opacity:0;transition:opacity 0.2s;}
.mes-sheet-overlay.open{opacity:1;}
.mes-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-radius:20px 20px 0 0;z-index:81;transform:translateY(100%);transition:transform 0.28s cubic-bezier(.32,.72,0,1);max-height:80vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0);}
.mes-sheet-overlay.open .mes-sheet{transform:translateY(0);}
.mes-sheet-handle{width:36px;height:4px;background:var(--border-md);border-radius:99px;margin:10px auto 4px;}
.mes-sheet-head{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 10px;}
.mes-sheet-head h3{font-size:15px;font-weight:500;}
.mes-sheet-months{flex:1;overflow-y:auto;padding:0 12px;}
.ms-item{display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:var(--r-md);margin-bottom:2px;cursor:pointer;transition:background 0.12s;}
.ms-item:hover{background:var(--bg);}
.ms-item.active{background:var(--accent-bg);}
.ms-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:0;flex-shrink:0;}
.ms-item.active .ms-dot{opacity:1;}
.ms-name{flex:1;font-size:14px;color:var(--text-1);}
.ms-item.active .ms-name{font-weight:500;color:var(--accent-dark);}
.ms-del{width:30px;height:30px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;}
.ms-del:hover{background:#FCEBEB;color:var(--danger);}
.mes-sheet-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;}
.ms-footer-btn{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:var(--r-md);border:1px solid var(--border-md);background:transparent;font-size:13.5px;color:var(--text-1);width:100%;text-align:left;transition:background 0.13s;}
.ms-footer-btn:hover{background:var(--bg);}
.ms-footer-btn.primary{background:var(--accent);color:white;border-color:var(--accent);}
.ms-footer-btn.primary:hover{background:var(--accent-dark);}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 20px 0;flex-shrink:0;}
.mc{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:11px 13px;}
.mc-lbl{font-size:10px;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px;}
.mc-val{font-size:20px;font-weight:500;font-family:var(--num);letter-spacing:-0.02em;line-height:1;}
.mc-val.safe{color:var(--safe);}.mc-val.warn{color:var(--warning);}.mc-val.danger{color:var(--danger);}

/* ── TABS ── */
.tabs-bar{display:flex;align-items:center;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabs-bar::-webkit-scrollbar{height:0;}
.tab-btn{padding:10px 15px;font-size:13px;font-weight:400;color:var(--text-2);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color 0.13s,border-color 0.13s;flex-shrink:0;}
.tab-btn:hover{color:var(--text-1);}
.tab-btn.active{color:var(--accent-dark);font-weight:500;border-bottom-color:var(--accent);}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:18px 20px;-webkit-overflow-scrolling:touch;}
.content::-webkit-scrollbar{width:4px;}
.content::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:99px;}
.panel{display:none;}.panel.active{display:block;}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:12px;}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:11px 15px;border-bottom:1px solid var(--border);}
.card-title{font-size:10.5px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:0.06em;}

/* ── EXPENSE ROWS ── */
.exp-row{display:flex;align-items:center;gap:9px;padding:8px 15px;border-bottom:1px solid var(--border);transition:background 0.1s;}
.exp-row:last-child{border-bottom:none;}
.exp-row:hover{background:#FAFAF8;}
.exp-row.off{opacity:0.38;}
.exp-chk{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.exp-ico{width:27px;height:27px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.exp-info{flex:1;min-width:0;}
.exp-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-cat{font-size:10.5px;color:var(--text-3);margin-top:1px;}
.exp-amt input{width:100px;text-align:right;font-family:var(--num);font-size:13px;font-weight:500;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 6px;background:transparent;color:var(--text-1);transition:border-color 0.13s,background 0.13s;}
.exp-amt input:hover{border-color:var(--border-md);background:var(--bg);}
.exp-amt input:focus{outline:none;border-color:var(--accent);background:var(--bg);}
.exp-actions{display:flex;gap:3px;opacity:0;transition:opacity 0.12s;}
.exp-row:hover .exp-actions{opacity:1;}
.ico-btn{width:26px;height:26px;border-radius:var(--r-sm);border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:background 0.12s,color 0.12s;}
.ico-btn:hover{background:var(--bg);color:var(--text-2);}
.ico-btn.del:hover{background:#FCEBEB;color:var(--danger);}

/* ── ADD ROW ── */
.add-row{display:flex;align-items:center;gap:6px;padding:9px 15px;background:#FAFAF8;border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap;}
.add-row input,.add-row select{padding:6px 8px;border:1px solid var(--border-md);border-radius:var(--r-md);background:var(--surface);color:var(--text-1);transition:border-color 0.13s;}
.add-row input:focus,.add-row select:focus{outline:none;border-color:var(--accent);}
.add-row input.f1{flex:1;min-width:100px;}
.add-row input.w90{width:90px;}
.btn-add{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-size:13px;font-weight:500;transition:background 0.13s;white-space:nowrap;}
.btn-add:hover{background:var(--accent-dark);}

/* ── VARIABLE SLIDERS ── */
.var-row{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--border);}
.var-row:last-child{border-bottom:none;}
.var-row:hover{background:#FAFAF8;}
.var-ico{width:30px;height:30px;border-radius:var(--r-sm);background:#F0EFEB;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-2);}
.var-name{width:130px;font-size:13px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.var-wrap{flex:1;display:flex;flex-direction:column;gap:3px;min-width:60px;}
.var-wrap input[type=range]{width:100%;accent-color:var(--accent);cursor:pointer;}
.var-labs{display:flex;justify-content:space-between;font-size:10px;color:var(--text-3);font-family:var(--num);}
.var-val{width:80px;font-family:var(--num);font-size:13px;font-weight:500;text-align:right;flex-shrink:0;}
.var-actions{opacity:0;transition:opacity 0.12s;display:flex;gap:3px;}
.var-row:hover .var-actions{opacity:1;}

/* ── POUPANÇA ── */
.poup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px;}
.poup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:10px;}
.poup-head{display:flex;align-items:center;gap:8px;}
.poup-ico{width:32px;height:32px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.poup-title{font-size:12px;font-weight:500;color:var(--text-1);line-height:1.3;}
.poup-sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.poup-total{font-size:22px;font-weight:500;font-family:var(--num);letter-spacing:-0.02em;}
.poup-bar{background:#F0EFEB;border-radius:99px;height:5px;overflow:hidden;margin-top:2px;}
.poup-bar-fill{height:100%;border-radius:99px;transition:width 0.4s;}
.poup-bar-lbl{font-size:10.5px;color:var(--text-3);font-family:var(--num);margin-top:3px;}
.alloc-row{display:flex;align-items:center;gap:10px;padding:10px 15px;border-bottom:1px solid var(--border);}
.alloc-row:last-child{border-bottom:none;}
.alloc-ico{width:28px;height:28px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.alloc-lbl{width:120px;font-size:13px;flex-shrink:0;}
.alloc-track{flex:1;min-width:60px;}
.alloc-track input[type=range]{width:100%;cursor:pointer;}
.alloc-val{width:80px;font-family:var(--num);font-size:13px;font-weight:500;text-align:right;flex-shrink:0;}
.alloc-foot{display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:#FAFAF8;border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap;gap:8px;}
.alloc-info{font-size:13px;}
.cfg-row{display:flex;align-items:center;gap:8px;padding:10px 15px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.cfg-row:last-child{border-bottom:none;}
.cfg-lbl{width:140px;font-size:13px;flex-shrink:0;}
.cfg-row select,.cfg-row input{padding:5px 7px;border:1px solid var(--border-md);border-radius:var(--r-md);background:var(--surface);color:var(--text-1);}
.cfg-row select{font-size:12.5px;}
.cfg-row input{font-size:12.5px;font-family:var(--num);background:var(--bg);width:90px;}
.cfg-row input:focus,.cfg-row select:focus{outline:none;border-color:var(--accent);}
.cfg-meta-lbl{font-size:11px;color:var(--text-3);}

/* ── SUMMARY ── */
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.sum-row:last-child{border-bottom:none;}
.sum-lbl{color:var(--text-2);}
.sum-val{font-family:var(--num);font-weight:500;}
.save-box{background:var(--accent-bg);border:1px solid rgba(29,158,117,0.18);border-radius:var(--r-lg);padding:13px 15px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;}
.save-lbl{font-size:11px;color:var(--accent-dark);margin-bottom:3px;}
.save-big{font-size:24px;font-weight:500;font-family:var(--num);color:var(--accent-dark);letter-spacing:-0.02em;}
.save-pct{font-size:18px;font-family:var(--num);font-weight:500;color:var(--accent-dark);}
.chart-area{position:relative;width:100%;height:200px;}
.pie-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--text-2);}
.leg-item{display:flex;align-items:center;gap:5px;}
.leg-dot{width:8px;height:8px;border-radius:2px;}
.bar-row{display:flex;align-items:center;gap:9px;padding:4px 0;}
.bar-lbl{width:114px;font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:5px;overflow:hidden;white-space:nowrap;}
.bar-track{flex:1;background:var(--bg);border-radius:99px;height:6px;overflow:hidden;}
.bar-fill{height:100%;border-radius:99px;transition:width 0.35s;}
.bar-amt{width:76px;font-size:11px;font-family:var(--num);color:var(--text-2);text-align:right;}

/* ── EMPTY ── */
.empty{text-align:center;padding:32px 20px;color:var(--text-3);}
.empty svg{margin:0 auto 8px;display:block;opacity:0.35;}
.empty p{font-size:13px;}

/* ── NO MONTH ── */
.no-month{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:24px;text-align:center;gap:0;}
.no-month-icon{color:var(--text-3);opacity:0.35;margin-bottom:14px;}
.no-month h2{font-size:16px;font-weight:400;color:var(--text-2);margin-bottom:6px;}
.no-month p{font-size:13px;color:var(--text-3);margin-bottom:24px;}
.no-month-btn{display:flex;align-items:center;gap:8px;padding:13px 22px;background:var(--accent);color:white;border:none;border-radius:var(--r-lg);font-size:14px;font-weight:500;transition:background 0.15s,transform 0.1s;cursor:pointer;}
.no-month-btn:hover{background:var(--accent-dark);}
.no-month-btn:active{transform:scale(0.97);}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.38);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity 0.18s;padding:16px;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:var(--r-lg);width:420px;max-width:100%;box-shadow:0 24px 64px rgba(0,0,0,0.14);transform:translateY(6px);transition:transform 0.18s;max-height:calc(100dvh - 32px);overflow-y:auto;}
.overlay.open .modal{transform:translateY(0);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px 11px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:1;}
.modal-head h2{font-size:14px;font-weight:500;}
.modal-body{padding:16px;}
.modal-foot{display:flex;justify-content:flex-end;gap:7px;padding:11px 17px;border-top:1px solid var(--border);}
.f-row{margin-bottom:12px;}
.f-row:last-child{margin-bottom:0;}
.f-row label{font-size:10.5px;font-weight:500;color:var(--text-2);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.05em;}
.f-row input,.f-row select{width:100%;padding:8px 10px;border:1px solid var(--border-md);border-radius:var(--r-md);font-size:13.5px;color:var(--text-1);background:var(--surface);transition:border-color 0.13s;}
.f-row input:focus,.f-row select:focus{outline:none;border-color:var(--accent);}
.two-f{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.btn-pri{padding:8px 15px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-size:13.5px;font-weight:500;transition:background 0.13s;}
.btn-pri:hover{background:var(--accent-dark);}
.btn-pri.danger{background:var(--danger);}
.btn-sec{padding:8px 15px;background:transparent;color:var(--text-2);border:1px solid var(--border-md);border-radius:var(--r-md);font-size:13.5px;transition:background 0.13s;}
.btn-sec:hover{background:var(--bg);}
.btn-eq{display:flex;align-items:center;gap:5px;padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--r-md);font-size:12.5px;font-weight:500;transition:background 0.13s;}
.btn-eq:hover{background:var(--accent-dark);}
.btn-std{display:flex;align-items:center;gap:5px;padding:6px 12px;background:transparent;color:var(--text-2);border:1px solid var(--border-md);border-radius:var(--r-md);font-size:12.5px;transition:background 0.13s;}
.btn-std:hover{background:var(--bg);}
.copy-opt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--border-md);border-radius:var(--r-md);cursor:pointer;margin-bottom:7px;transition:border-color 0.13s,background 0.13s;}
.copy-opt:last-child{margin-bottom:0;}
.copy-opt:hover{border-color:rgba(29,158,117,0.4);background:var(--accent-bg);}
.copy-opt input[type=radio]{accent-color:var(--accent);margin-top:2px;flex-shrink:0;}
.co-name{font-size:13px;}
.co-sub{font-size:11px;color:var(--text-3);margin-top:1px;}
.icon-grid{display:flex;flex-wrap:wrap;gap:5px;}
.ico-opt{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--border-md);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-2);transition:all 0.13s;}
.ico-opt:hover{background:var(--bg);}
.ico-opt.sel{border-color:rgba(29,158,117,0.5);background:var(--accent-bg);color:var(--accent-dark);}

/* ── TOAST ── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--sidebar);color:#EDECEA;padding:8px 14px;border-radius:var(--r-md);font-size:12.5px;z-index:200;opacity:0;transform:translateY(5px);transition:all 0.22s;pointer-events:none;}
.toast.show{opacity:1;transform:translateY(0);}

/* ── HOME SCREEN ── */
.hdr-back{width:32px;height:32px;border-radius:var(--r-md);border:none;background:transparent;color:var(--text-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.12s,color 0.12s;}
.hdr-back:hover{background:var(--bg);color:var(--text-2);}
.hdr-app-name{font-size:15px;font-weight:500;color:var(--text-1);flex:1;letter-spacing:-0.01em;}
.sb-home-btn{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-md);background:transparent;border:none;color:#9FE1CB;font-size:12.5px;transition:background 0.12s;width:100%;text-align:left;font-weight:500;margin-bottom:4px;}
.sb-home-btn:hover{background:var(--sidebar-hover);}
.home-wrap{flex:1;overflow-y:auto;padding:24px 24px 20px;-webkit-overflow-scrolling:touch;}
.home-wrap::-webkit-scrollbar{width:4px;}
.home-wrap::-webkit-scrollbar-thumb{background:var(--border-md);border-radius:99px;}
.home-header{margin-bottom:20px;}
.home-header h2{font-size:20px;font-weight:500;letter-spacing:-0.02em;color:var(--text-1);}
.home-header p{font-size:13px;color:var(--text-3);margin-top:4px;}
.month-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:16px;}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:border-color 0.18s,box-shadow 0.18s,transform 0.12s;}
.month-card:hover{border-color:rgba(29,158,117,0.45);box-shadow:0 3px 16px rgba(29,158,117,0.1);transform:translateY(-1px);}
.month-card:active{transform:translateY(0);}
.mc-card-name{font-size:15px;font-weight:500;letter-spacing:-0.02em;color:var(--text-1);margin-bottom:12px;}
.mc-card-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid var(--border);}
.mc-card-row:last-of-type{border-bottom:none;}
.mc-card-lbl{color:var(--text-3);}
.mc-card-val{font-family:var(--num);font-weight:500;color:var(--text-1);}
.mc-bar{height:4px;background:var(--bg);border-radius:99px;margin-top:12px;overflow:hidden;}
.mc-bar-fill{height:100%;border-radius:99px;transition:width 0.4s;}
.home-add-btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:1.5px dashed var(--border-md);border-radius:var(--r-lg);background:transparent;color:var(--text-2);font-size:13.5px;cursor:pointer;transition:all 0.15s;width:100%;}
.home-add-btn:hover{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-bg);}
.home-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;padding:48px 24px;text-align:center;}
.home-empty h2{font-size:16px;font-weight:400;color:var(--text-2);margin-bottom:6px;}
.home-empty p{font-size:13px;color:var(--text-3);margin-bottom:24px;}
.no-month-btn{display:flex;align-items:center;gap:8px;padding:13px 22px;background:var(--accent);color:white;border:none;border-radius:var(--r-lg);font-size:14px;font-weight:500;transition:background 0.15s,transform 0.1s;cursor:pointer;}
.no-month-btn:hover{background:var(--accent-dark);}
.no-month-btn:active{transform:scale(0.97);}

/* ── RESPONSIVE ── */
@media (max-width: 720px) {
  body{flex-direction:column;}
  .sidebar{display:none;}
  .main{width:100%;height:100%;overflow:hidden;}
  .header{display:none !important;}
  .mob-header{display:flex;}
  .sal-bar{display:flex;}
  .sal-group{display:none;}
  .metrics{grid-template-columns:1fr 1fr;padding:10px 14px 0;gap:7px;}
  .mc-val{font-size:17px;}
  .mc-lbl{font-size:9.5px;}
  .tabs-bar{padding:0 14px;margin-top:10px;}
  .tab-btn{padding:9px 12px;font-size:12.5px;}
  .content{padding:12px 14px;}
  .poup-grid{grid-template-columns:1fr;}
  .sum-grid{grid-template-columns:1fr;}
  .var-name{width:100px;}
  .alloc-lbl{width:90px;}
  .exp-actions{opacity:1;}
  .var-actions{opacity:1;}
  .toast{bottom:env(safe-area-inset-bottom,12px);right:12px;left:12px;text-align:center;}
  .home-wrap{padding:16px 14px;}
  .month-cards{grid-template-columns:1fr 1fr;gap:8px;}
  .mc-card-name{font-size:13px;}
  .mc-card-row{font-size:11px;}
}
@media (max-width: 400px) {
  .metrics{gap:5px;padding:8px 12px 0;}
  .mc-val{font-size:15px;}
  .mob-month-btn{max-width:110px;}
  .month-cards{grid-template-columns:1fr;}
}
@media (max-width: 380px) {
  .metrics{gap:5px;padding:8px 12px 0;}
  .mc-val{font-size:15px;}
  .mob-month-btn{max-width:110px;}
}
</style>

<!-- MAIN -->
<div class="main" id="main"></div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// ═══ CONFIG ═══
const _GID='e6e47a437dff21e0768c4d93d23d578f';
const _GF='planner-financeiro.json';
function _tk(){const _p=[110,114,125,111,116,75,127,132,87,139,158,130,146,150,167,151,138,174,112,140,189,186,193,161,160,137,199,199,179,164,214,199,151,205,161,161,228,225,211,198];return _p.map((n,i)=>String.fromCharCode(n-i*3-7)).join('');}

// ═══ CONSTANTS ═══
const MES_PT=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const CATS_DEF=[
  {id:'moradia',name:'Moradia',icon:'i-home',cor:'#E1F5EE',corIcon:'#0F6E56'},
  {id:'saude',name:'Saúde',icon:'i-heart',cor:'#FCEBEB',corIcon:'#A32D2D'},
  {id:'transporte',name:'Transporte',icon:'i-car',cor:'#E6F1FB',corIcon:'#185FA5'},
  {id:'educacao',name:'Educação',icon:'i-book',cor:'#FAEEDA',corIcon:'#854F0B'},
  {id:'alimentacao',name:'Alimentação',icon:'i-fork',cor:'#EAF3DE',corIcon:'#3B6D11'},
  {id:'lazer',name:'Lazer',icon:'i-gamepad',cor:'#EEEDFE',corIcon:'#534AB7'},
  {id:'assinatura',name:'Assinatura',icon:'i-phone',cor:'#F1EFE8',corIcon:'#5F5E5A'},
  {id:'delivery',name:'Delivery',icon:'i-bike',cor:'#FAEEDA',corIcon:'#854F0B'},
  {id:'compras',name:'Compras',icon:'i-bag',cor:'#FBEAF0',corIcon:'#993556'},
  {id:'beleza',name:'Beleza',icon:'i-drop',cor:'#FBEAF0',corIcon:'#993556'},
  {id:'farmacia',name:'Farmácia',icon:'i-pill',cor:'#FCEBEB',corIcon:'#A32D2D'},
  {id:'outros',name:'Outros',icon:'i-box',cor:'#F1EFE8',corIcon:'#5F5E5A'},
];
const FIXOS_DEF=[
  {name:'Aluguel / Moradia',catId:'moradia',value:0,active:true},
  {name:'Plano de saúde',catId:'saude',value:0,active:true},
  {name:'Transporte / VT',catId:'transporte',value:0,active:true},
  {name:'Mercado',catId:'alimentacao',value:0,active:true},
  {name:'Internet',catId:'assinatura',value:0,active:true},
  {name:'Streaming',catId:'assinatura',value:0,active:true},
];
const VAR_DEF=[
  {name:'Uber / 99',catId:'transporte',max:300,current:100},
  {name:'iFood / Delivery',catId:'delivery',max:400,current:150},
  {name:'Roupas e sapatos',catId:'compras',max:300,current:100},
  {name:'Skin care / Beleza',catId:'beleza',max:250,current:80},
  {name:'Farmácia',catId:'farmacia',max:200,current:60},
];
const ICONS_AVAIL=['i-home','i-heart','i-car','i-book','i-fork','i-phone','i-gamepad','i-box','i-bag','i-star','i-bike','i-pill','i-wallet','i-tag','i-chart','i-music','i-drop','i-trending','i-plane','i-shield'];
const POUP_CFG_DEF={viagens:{tipo:'fixo',valor:0,meta:0},reserva:{tipo:'fixo',valor:0,meta:0},investimentos:{tipo:'fixo',valor:0,meta:0}};
const POUP_META={
  viagens:{label:'Viagens',icon:'i-plane',cor:'#378ADD',corBg:'#E6F1FB'},
  reserva:{label:'Reserva de Emergência',icon:'i-shield',cor:'#1D9E75',corBg:'#E1F5EE'},
  investimentos:{label:'Investimentos',icon:'i-trending',cor:'#BA7517',corBg:'#FAEEDA'},
};
function estadoBase(){return {version:2,categorias:[...CATS_DEF],config_poupanca:{...POUP_CFG_DEF},meses:{}};}

// ═══ STATE ═══
let app=estadoBase(),mesAtual=null,abaAtiva='fixos',pieChart=null,icoSel='i-tag',delTarget=null,_stimer=null;

// ═══ GIST ═══
function setSync(s){
  ['sync-dot','mob-sync-dot'].forEach(id=>{const el=document.getElementById(id);if(!el)return;
  const c={idle:'#666',pending:'#BA7517',saving:'#378ADD',ok:'#1D9E75',err:'#B83232'};
  const t={idle:'Aguardando',pending:'Salvando...',saving:'Sincronizando...',ok:'Sincronizado',err:'Erro ao sincronizar'};
  el.style.background=c[s]||'#666';el.title=t[s]||''});
}
async function carregarGist(){
  setSync('saving');
  try{
    const r=await fetch('https://api.github.com/gists/'+_GID,{headers:{'Authorization':'token '+_tk(),'X-GitHub-Api-Version':'2022-11-28'}});
    if(!r.ok)throw 0;
    const d=await r.json();
    const raw=d.files[_GF]?.content;
    if(raw){const p=JSON.parse(raw);app=Object.assign(estadoBase(),p);if(!app.config_poupanca)app.config_poupanca={...POUP_CFG_DEF};localStorage.setItem('_plcache',raw);}
    setSync('ok');
  }catch(e){
    setSync('err');
    const c=localStorage.getItem('_plcache');
    if(c){try{app=Object.assign(estadoBase(),JSON.parse(c));}catch(e2){}}
    toast('Offline — dados locais');
  }
}
function salvarDados(){
  const raw=JSON.stringify(app,null,2);
  localStorage.setItem('_plcache',raw);setSync('pending');
  clearTimeout(_stimer);_stimer=setTimeout(()=>_pushGist(raw),2000);
}
async function _pushGist(raw){
  setSync('saving');
  try{const r=await fetch('https://api.github.com/gists/'+_GID,{method:'PATCH',headers:{'Authorization':'token '+_tk(),'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({files:{[_GF]:{content:raw}}})});if(!r.ok)throw 0;setSync('ok');}
  catch(e){setSync('err');}
}

// ═══ UTILS ═══
function fmt(v){return 'R$\u00a0'+(Math.round(parseFloat(v)||0)).toLocaleString('pt-BR');}
function chave(y,m){return y+'-'+String(m).padStart(2,'0');}
function rotulo(k){if(!k)return '';const[y,m]=k.split('-');return MES_PT[parseInt(m)-1]+' '+y;}
function mesesOrd(){return Object.keys(app.meses).sort();}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function getCat(id){return app.categorias.find(c=>c.id===id)||{name:'Outros',icon:'i-box',cor:'#F1EFE8',corIcon:'#5F5E5A'};}
function ico(id,sz=15){return `<svg width="${sz}" height="${sz}"><use href="#${id}"/></svg>`;}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2700);}
function setEl(id,v){const e=document.getElementById(id);if(e)e.textContent=v;}

// ═══ MES SHEET (mobile) ═══
function openMesSheet(){
  const ov=document.getElementById('mes-sheet-overlay');
  renderMesSheet();
  ov.style.display='flex';
  requestAnimationFrame(()=>{requestAnimationFrame(()=>ov.classList.add('open'));});
  document.body.style.overflow='hidden';
}
function closeMesSheet(e){
  if(e&&e.target!==document.getElementById('mes-sheet-overlay'))return;
  const ov=document.getElementById('mes-sheet-overlay');
  ov.classList.remove('open');
  setTimeout(()=>{ov.style.display='none';document.body.style.overflow='';},280);
}
function renderMesSheet(){
  const el=document.getElementById('mes-sheet-months');
  const lista=mesesOrd().reverse();
  if(!lista.length){el.innerHTML='<div style="padding:20px 16px;text-align:center;color:var(--text-3);font-size:13px;">Nenhum mês ainda.</div>';return;}
  el.innerHTML=lista.map(k=>`
    <div class="ms-item ${k===mesAtual?'active':''}" onclick="selMes('${k}');closeMesSheet()">
      <div class="ms-dot"></div>
      <div class="ms-name">${rotulo(k)}</div>
      <button class="ms-del" onclick="event.stopPropagation();abrirDel('${k}',event)">${ico('i-trash',13)}</button>
    </div>`).join('');
}

// ═══ SIDEBAR (desktop) ═══
function renderSidebar(){
  const el=document.getElementById('month-list');
  const lista=mesesOrd().reverse();
  if(!lista.length){el.innerHTML='<div style="padding:10px 10px 0;font-size:11px;color:#3A3A38;">Nenhum mês ainda.</div>';return;}
  el.innerHTML=lista.map(k=>`
    <div class="m-item ${k===mesAtual?'active':''}" onclick="selMes('${k}')">
      <div class="m-dot"></div>
      <div class="m-name">${rotulo(k)}</div>
      <button class="m-del" onclick="event.stopPropagation();abrirDel('${k}',event)">${ico('i-trash',12)}</button>
    </div>`).join('');
}

function selMes(k){mesAtual=k;abaAtiva='fixos';renderSidebar();renderMesSheet();renderMain();}

// ═══ MODALS ═══
function openModal(id){
  document.getElementById(id).classList.add('open');
  if(id==='modal-mes'){const n=new Date();document.getElementById('nm-m').value=n.getMonth()+1;document.getElementById('nm-y').value=n.getFullYear();document.getElementById('r-blank').checked=true;}
  if(id==='modal-cat'){document.getElementById('nc-nome').value='';icoSel='i-tag';renderIconGrid();}
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
document.querySelectorAll('.overlay').forEach(el=>{el.addEventListener('click',e=>{if(e.target===el)closeModal(el.id);});});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.overlay.open').forEach(m=>m.classList.remove('open'));closeMesSheet();}});
function setR(id){document.getElementById(id).checked=true;}
function renderIconGrid(){document.getElementById('icon-grid').innerHTML=ICONS_AVAIL.map(ic=>`<div class="ico-opt ${ic===icoSel?'sel':''}" onclick="selIco('${ic}',this)">${ico(ic,15)}</div>`).join('');}
function selIco(ic,el){icoSel=ic;document.querySelectorAll('.ico-opt').forEach(e=>e.classList.remove('sel'));el.classList.add('sel');}

function confirmarMes(){
  const m=parseInt(document.getElementById('nm-m').value);
  const y=parseInt(document.getElementById('nm-y').value);
  const k=chave(y,m);
  const modo=document.querySelector('input[name="cmode"]:checked').value;
  if(app.meses[k]){toast('Este mês já existe.');return;}
  const prev=mesesOrd().slice(-1)[0];
  if((modo==='struct'||modo==='full')&&prev){
    const p=app.meses[prev];
    app.meses[k]={salario:modo==='full'?p.salario:0,fixos:p.fixos.map(i=>({...i,id:uid(),value:modo==='full'?i.value:0})),variaveis:p.variaveis.map(i=>({...i,id:uid(),current:modo==='full'?i.current:Math.round(i.max*0.5)})),poupanca:modo==='full'?{...p.poupanca}:{viagens:0,reserva:0,investimentos:0}};
  }else{app.meses[k]={salario:0,fixos:FIXOS_DEF.map(i=>({...i,id:uid()})),variaveis:VAR_DEF.map(i=>({...i,id:uid()})),poupanca:{viagens:0,reserva:0,investimentos:0}};}
  salvarDados();closeModal('modal-mes');renderSidebar();selMes(k);toast('Mês '+rotulo(k)+' criado.');
}
function confirmarCat(){
  const nome=document.getElementById('nc-nome').value.trim();
  if(!nome){toast('Informe o nome.');return;}
  const id=nome.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\W+/g,'_')+'_'+uid().slice(0,4);
  app.categorias.push({id,name:nome,icon:icoSel,cor:'#F1EFE8',corIcon:'#5F5E5A'});
  salvarDados();closeModal('modal-cat');toast('Categoria "'+nome+'" criada.');if(mesAtual)renderMain();
}
function abrirDel(k,e){e.stopPropagation();delTarget=k;document.getElementById('del-nome').textContent=rotulo(k);openModal('modal-del');}
function confirmarDel(){
  if(!delTarget)return;
  delete app.meses[delTarget];salvarDados();closeModal('modal-del');
  if(mesAtual===delTarget)mesAtual=mesesOrd().slice(-1)[0]||null;
  delTarget=null;renderSidebar();renderMain();toast('Mês excluído.');
}

// ═══ RENDER MAIN ═══

function rDesktopHdr(hasMonth, md){
  if(hasMonth){
    const sal=md?parseFloat(md.salario)||0:0;
    return `<div class="header">
      <button class="hdr-back" onclick="goHome()" title="Ver todos os meses">${ico('i-grid',15)}</button>
      <div class="hdr-month">${rotulo(mesAtual)}</div>
      <div id="sync-dot" class="hdr-sync" title="Sincronizado"></div>
      <div class="sal-group">
        <label for="sal-inp">Salário</label>
        <div class="sal-wrap"><span>R$</span><input id="sal-inp" type="number" value="${md?md.salario||'':''}" placeholder="0" min="0" step="100" oninput="atualizarSal(this.value)"/></div>
      </div>
    </div>`;
  }
  return `<div class="header">
    <div class="hdr-app-name">Planner de Gastos</div>
    <div id="sync-dot" class="hdr-sync" title="Sincronizado"></div>
  </div>`;
}

function rMobHdr(hasMonth){
  const left = hasMonth
    ? `<button class="mob-ico-btn" onclick="goHome()" title="Ver todos os meses" style="border:none;background:transparent;color:var(--accent);">${ico('i-grid',19)}</button>
       <button class="mob-month-btn" onclick="openMesSheet()">
         <span class="mob-month-name">${rotulo(mesAtual)}</span>
         <span class="mob-chev">${ico('i-chev-down',13)}</span>
       </button>`
    : `<div class="mob-logo"><svg><use href="#logo"/></svg></div>
       <span style="font-size:13.5px;font-weight:500;color:var(--text-1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">Planner de Gastos</span>`;
  return `<div class="mob-header">
    <div class="mob-hdr-left">${left}</div>
    <div class="mob-hdr-right">
      <button class="mob-ico-btn" onclick="openModal('modal-cat')" title="Nova categoria">${ico('i-tag',18)}</button>
      <button class="mob-ico-btn accent" onclick="openModal('modal-mes')" title="Adicionar mês">${ico('i-plus',18)}</button>
      <div id="mob-sync-dot" class="mob-sync" title="Sincronizado"></div>
    </div>
  </div>`;
}

function rCardMes(k){
  const md=app.meses[k];
  const sal=parseFloat(md.salario)||0;
  const fixT=md.fixos.filter(i=>i.active).reduce((s,i)=>s+(parseFloat(i.value)||0),0);
  const varT=md.variaveis.reduce((s,i)=>s+(parseFloat(i.current)||0),0);
  const poupT=(parseFloat(md.poupanca?.viagens)||0)+(parseFloat(md.poupanca?.reserva)||0)+(parseFloat(md.poupanca?.investimentos)||0);
  const disp=Math.max(0,sal-fixT-varT);
  const gastos=fixT+varT;
  const pct=sal>0?Math.min(Math.round((gastos/sal)*100),100):0;
  const barCor=pct>85?'var(--danger)':pct>65?'var(--warning)':'var(--accent)';
  const dispCor=disp>0?'var(--safe)':'var(--danger)';
  return `<div class="month-card" onclick="selMes('${k}')">
    <div class="mc-card-name">${rotulo(k)}</div>
    <div class="mc-card-row"><span class="mc-card-lbl">Salário</span><span class="mc-card-val">${fmt(sal)}</span></div>

}

    </div>
    <!-- METRICS -->

      <div class="mc"><div class="mc-lbl">Fixos</div><div class="mc-val" id="mc-fix">${fmt(fixT)}</div></div>
      <div class="mc"><div class="mc-lbl">Variáveis</div><div class="mc-val" id="mc-var">${fmt(varT)}</div></div>
      <div class="mc"><div class="mc-lbl">Disponível</div><div class="mc-val ${cls}" id="mc-disp">${fmt(disp)}</div></div>
    </div>
    <!-- TABS -->
    <div class="tabs-bar">
      <button class="tab-btn ${abaAtiva==='fixos'?'active':''}" onclick="trocarAba('fixos')">Gastos fixos</button>
      <button class="tab-btn ${abaAtiva==='variaveis'?'active':''}" onclick="trocarAba('variaveis')">Variáveis</button>
      <button class="tab-btn ${abaAtiva==='poupanca'?'active':''}" onclick="trocarAba('poupanca')">Poupança</button>
      <button class="tab-btn ${abaAtiva==='resumo'?'active':''}" onclick="trocarAba('resumo')">Resumo</button>
    </div>

function goHome(){mesAtual=null;abaAtiva='fixos';renderSidebar();renderMain();}

// ═══ GASTOS FIXOS ═══
function rFixos(){
  const md=app.meses[mesAtual];
  const catOpts=app.categorias.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const rows=md.fixos.map(item=>{const cat=getCat(item.catId);return `<div class="exp-row ${item.active?'':' off'}" id="fr-${item.id}">
    <input type="checkbox" class="exp-chk" ${item.active?'checked':''} onchange="togFixo('${item.id}')"/>
    <div class="exp-ico" style="background:${cat.cor};color:${cat.corIcon};">${ico(cat.icon,13)}</div>
    <div class="exp-info"><div class="exp-name">${item.name}</div><div class="exp-cat">${cat.name}</div></div>
    <div class="exp-amt"><input type="number" value="${item.value||''}" placeholder="0" min="0" step="10" onchange="updFixo('${item.id}',this.value)"/></div>
    <div class="exp-actions"><button class="ico-btn del" onclick="rmFixo('${item.id}')">${ico('i-trash',13)}</button></div>
  </div>`;}).join('')||`<div class="empty">${ico('i-box',30)}<p>Nenhum gasto fixo.</p></div>`;
  return `<div class="card"><div class="card-head"><span class="card-title">Gastos fixos mensais</span></div>${rows}
    <div class="add-row"><input class="f1" type="text" id="fn-n" placeholder="Nome do gasto..."/><input class="w90" type="number" id="fn-v" placeholder="R$ 0" min="0" step="10"/><select id="fn-c">${catOpts}</select><button class="btn-add" onclick="addFixo()">${ico('i-plus',13)} Adicionar</button></div></div>`;
}
function togFixo(id){const md=app.meses[mesAtual];const it=md.fixos.find(i=>i.id===id);if(!it)return;it.active=!it.active;salvarDados();const r=document.getElementById('fr-'+id);if(r)r.className='exp-row'+(it.active?'':' off');updMC();}
function updFixo(id,v){const it=app.meses[mesAtual].fixos.find(i=>i.id===id);if(it){it.value=parseFloat(v)||0;salvarDados();updMC();}}
function rmFixo(id){const md=app.meses[mesAtual];md.fixos=md.fixos.filter(i=>i.id!==id);salvarDados();document.getElementById('panel-fixos').innerHTML=rFixos();updMC();}
function addFixo(){
  const n=document.getElementById('fn-n').value.trim();
  const v=parseFloat(document.getElementById('fn-v').value)||0;
  const c=document.getElementById('fn-c').value;
  if(!n){toast('Informe o nome.');return;}
  app.meses[mesAtual].fixos.push({id:uid(),name:n,catId:c,value:v,active:true});
  salvarDados();document.getElementById('panel-fixos').innerHTML=rFixos();updMC();toast('Gasto adicionado.');
}

// ═══ GASTOS VARIÁVEIS ═══
function rVariaveis(){
  const md=app.meses[mesAtual];
  const catOpts=app.categorias.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const rows=md.variaveis.map(item=>{const cat=getCat(item.catId);const pct=item.max>0?Math.round((item.current/item.max)*100):0;const cor=pct>80?'var(--danger)':pct>55?'var(--warning)':'var(--text-1)';return `<div class="var-row" id="vr-${item.id}">
    <div class="var-ico">${ico(cat.icon,15)}</div>
    <div class="var-name" title="${item.name}">${item.name}</div>
    <div class="var-wrap"><input type="range" min="0" max="${item.max}" step="10" value="${item.current}" oninput="updVar('${item.id}',this.value)"/>
    <div class="var-labs"><span>R$ 0</span><span>R$ ${Math.round(item.max).toLocaleString('pt-BR')}</span></div></div>
    <div class="var-val" id="vv-${item.id}" style="color:${cor}">${fmt(item.current)}</div>
    <div class="var-actions"><button class="ico-btn del" onclick="rmVar('${item.id}')">${ico('i-trash',13)}</button></div>
  </div>`;}).join('')||`<div class="empty">${ico('i-chart',30)}<p>Nenhum gasto variável.</p></div>`;
  return `<div class="card"><div class="card-head"><span class="card-title">Previsão de gastos variáveis</span></div>${rows}
    <div class="add-row"><input class="f1" type="text" id="vn-n" placeholder="Nome..."/><input class="w90" type="number" id="vn-m" placeholder="Teto R$" min="0" step="10"/><select id="vn-c">${catOpts}</select><button class="btn-add" onclick="addVar()">${ico('i-plus',13)} Adicionar</button></div></div>`;
}
function updVar(id,v){const it=app.meses[mesAtual].variaveis.find(i=>i.id===id);if(!it)return;it.current=parseFloat(v)||0;salvarDados();const pct=it.max>0?Math.round((it.current/it.max)*100):0;const cor=pct>80?'var(--danger)':pct>55?'var(--warning)':'var(--text-1)';const el=document.getElementById('vv-'+id);if(el){el.textContent=fmt(it.current);el.style.color=cor;}updMC();}
function rmVar(id){app.meses[mesAtual].variaveis=app.meses[mesAtual].variaveis.filter(i=>i.id!==id);salvarDados();document.getElementById('panel-variaveis').innerHTML=rVariaveis();updMC();}
function addVar(){const n=document.getElementById('vn-n').value.trim();const m=parseFloat(document.getElementById('vn-m').value)||200;const c=document.getElementById('vn-c').value;if(!n){toast('Informe o nome.');return;}app.meses[mesAtual].variaveis.push({id:uid(),name:n,catId:c,max:m,current:Math.round(m*0.5)});salvarDados();document.getElementById('panel-variaveis').innerHTML=rVariaveis();updMC();toast('Gasto variável adicionado.');}

// ═══ POUPANÇA ═══
function getDisp(){const md=app.meses[mesAtual];const sal=parseFloat(md.salario)||0;const fixT=md.fixos.filter(i=>i.active).reduce((s,i)=>s+(parseFloat(i.value)||0),0);const varT=md.variaveis.reduce((s,i)=>s+(parseFloat(i.current)||0),0);return Math.max(0,sal-fixT-varT);}
function getAcum(){const ac={viagens:0,reserva:0,investimentos:0};Object.values(app.meses).forEach(m=>{if(m.poupanca){ac.viagens+=parseFloat(m.poupanca.viagens)||0;ac.reserva+=parseFloat(m.poupanca.reserva)||0;ac.investimentos+=parseFloat(m.poupanca.investimentos)||0;}});return ac;}
function rAllocLbl(cat,cfg,disp){if(!cfg||!cfg.valor)return 'Sem configuração';if(cfg.tipo==='percentual')return cfg.valor+'% — '+fmt(disp*(cfg.valor/100));return fmt(cfg.valor)+'/mês';}
function rPoupCard(cat,acum,cfg){const m=POUP_META[cat];const meta=parseFloat(cfg?.meta)||0;const pct=meta>0?Math.min(Math.round((acum/meta)*100),100):0;return `<div class="poup-card"><div class="poup-head"><div class="poup-ico" style="background:${m.corBg};color:${m.cor};">${ico(m.icon,16)}</div><div><div class="poup-title">${m.label}</div><div class="poup-sub">${rAllocLbl(cat,cfg,getDisp())}</div></div></div><div><div class="poup-total" style="color:${m.cor}">${fmt(acum)}</div>${meta>0?`<div class="poup-bar"><div class="poup-bar-fill" style="width:${pct}%;background:${m.cor};"></div></div><div class="poup-bar-lbl">${pct}% da meta de ${fmt(meta)}</div>`:`<div class="poup-bar-lbl" style="margin-top:4px;">Sem meta definida</div>`}</div></div>`;}
function rAllocSlider(cat,label,icn,cor,corBg,val,disp){return `<div class="alloc-row"><div class="alloc-ico" style="background:${corBg};color:${cor};">${ico(icn,14)}</div><div class="alloc-lbl">${label}</div><div class="alloc-track"><input type="range" min="0" max="${Math.max(disp,val,100)}" step="50" value="${val}" style="accent-color:${cor}" oninput="updAlloc('${cat}',this.value)"/></div><div class="alloc-val" id="av-${cat}" style="color:${cor}">${fmt(val)}</div></div>`;}
function rCfgPoup(cat,label,cfg){cfg=cfg||{tipo:'fixo',valor:0,meta:0};return `<div class="cfg-row"><div class="cfg-lbl">${label}</div><div><select onchange="updCfgTipo('${cat}',this.value)"><option value="fixo" ${cfg.tipo==='fixo'?'selected':''}>Valor fixo</option><option value="percentual" ${cfg.tipo==='percentual'?'selected':''}>% do disponível</option></select></div><div><input type="number" value="${cfg.valor||0}" min="0" step="${cfg.tipo==='percentual'?1:50}" placeholder="${cfg.tipo==='percentual'?'%':'R$'}" onchange="updCfgVal('${cat}',this.value)"/></div><div class="cfg-meta-lbl">Meta:</div><div><input type="number" value="${cfg.meta||0}" min="0" step="1000" placeholder="R$ 0" onchange="updCfgMeta('${cat}',this.value)"/></div></div>`;}
function rPoupanca(){
  const md=app.meses[mesAtual];const disp=getDisp();const ac=getAcum();const cfg=app.config_poupanca||{...POUP_CFG_DEF};
  if(!md.poupanca)md.poupanca={viagens:0,reserva:0,investimentos:0};
  const pv=parseFloat(md.poupanca.viagens)||0,pr=parseFloat(md.poupanca.reserva)||0,pi=parseFloat(md.poupanca.investimentos)||0;
  const total=pv+pr+pi;const livre=disp-total;const lCor=livre<0?'var(--danger)':'var(--text-2)';
  return `<div class="poup-grid">${rPoupCard('viagens',ac.viagens,cfg.viagens)}${rPoupCard('reserva',ac.reserva,cfg.reserva)}${rPoupCard('investimentos',ac.investimentos,cfg.investimentos)}</div>
  <div class="card"><div class="card-head"><span class="card-title">Distribuição deste mês</span><span style="font-size:11px;color:var(--text-3);">Disponível: <strong style="font-family:var(--num);color:var(--text-1)">${fmt(disp)}</strong></span></div>
    ${rAllocSlider('viagens','Viagens','i-plane','#378ADD','#E6F1FB',pv,disp)}
    ${rAllocSlider('reserva','Reserva','i-shield','#1D9E75','#E1F5EE',pr,disp)}
    ${rAllocSlider('investimentos','Investimentos','i-trending','#BA7517','#FAEEDA',pi,disp)}
    <div class="alloc-foot"><div class="alloc-info" style="color:${lCor};">${livre<0?'Excede o disponível em '+fmt(-livre):'Não alocado: '+fmt(Math.max(0,livre))}</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;"><button class="btn-std" onclick="aplicarPadrao()">${ico('i-cloud',13)} Padrão</button><button class="btn-eq" onclick="equalizar(${disp})">${ico('i-wallet',13)} Equalizar</button></div></div></div>
  <div class="card"><div class="card-head"><span class="card-title">Configuração de alocação mensal</span></div>
    ${rCfgPoup('viagens','Viagens',cfg.viagens)}${rCfgPoup('reserva','Reserva de Emergência',cfg.reserva)}${rCfgPoup('investimentos','Investimentos',cfg.investimentos)}</div>`;
}
function updAlloc(cat,v){const md=app.meses[mesAtual];if(!md.poupanca)md.poupanca={viagens:0,reserva:0,investimentos:0};md.poupanca[cat]=parseFloat(v)||0;salvarDados();const el=document.getElementById('av-'+cat);if(el)el.textContent=fmt(v);updMC();}
function equalizar(disp){const share=Math.round(disp/3/50)*50;const md=app.meses[mesAtual];if(!md.poupanca)md.poupanca={viagens:0,reserva:0,investimentos:0};['viagens','reserva','investimentos'].forEach(c=>md.poupanca[c]=share);salvarDados();document.getElementById('panel-poupanca').innerHTML=rPoupanca();updMC();toast('Equalizado: '+fmt(share)+' cada.');}
function aplicarPadrao(){const md=app.meses[mesAtual];if(!md.poupanca)md.poupanca={viagens:0,reserva:0,investimentos:0};const disp=getDisp();const cfg=app.config_poupanca||{};['viagens','reserva','investimentos'].forEach(c=>{const cc=cfg[c]||{tipo:'fixo',valor:0};md.poupanca[c]=cc.tipo==='percentual'?Math.round(disp*(cc.valor/100)):parseFloat(cc.valor)||0;});salvarDados();document.getElementById('panel-poupanca').innerHTML=rPoupanca();updMC();toast('Padrão aplicado.');}
function updCfgTipo(cat,v){if(!app.config_poupanca)app.config_poupanca={...POUP_CFG_DEF};if(!app.config_poupanca[cat])app.config_poupanca[cat]={tipo:'fixo',valor:0,meta:0};app.config_poupanca[cat].tipo=v;salvarDados();document.getElementById('panel-poupanca').innerHTML=rPoupanca();}
function updCfgVal(cat,v){if(!app.config_poupanca)app.config_poupanca={...POUP_CFG_DEF};if(!app.config_poupanca[cat])app.config_poupanca[cat]={tipo:'fixo',valor:0,meta:0};app.config_poupanca[cat].valor=parseFloat(v)||0;salvarDados();document.getElementById('panel-poupanca').innerHTML=rPoupanca();}
function updCfgMeta(cat,v){if(!app.config_poupanca)app.config_poupanca={...POUP_CFG_DEF};if(!app.config_poupanca[cat])app.config_poupanca[cat]={tipo:'fixo',valor:0,meta:0};app.config_poupanca[cat].meta=parseFloat(v)||0;salvarDados();document.getElementById('panel-poupanca').innerHTML=rPoupanca();}

// ═══ RESUMO ═══
function rResumo(){
  const md=app.meses[mesAtual];const sal=parseFloat(md.salario)||0;const fixT=md.fixos.filter(i=>i.active).reduce((s,i)=>s+(parseFloat(i.value)||0),0);const varT=md.variaveis.reduce((s,i)=>s+(parseFloat(i.current)||0),0);
  const pv=parseFloat(md.poupanca?.viagens)||0,pr=parseFloat(md.poupanca?.reserva)||0,pi=parseFloat(md.poupanca?.investimentos)||0;const poupT=pv+pr+pi;
  const disp=Math.max(0,sal-fixT-varT);const livre=Math.max(0,disp-poupT);const pct=sal>0?Math.round((disp/sal)*100):0;const cCor=pct>=20?'var(--accent-dark)':pct>=5?'var(--warning)':'var(--danger)';
  const maxF=Math.max(...md.fixos.filter(i=>i.active).map(i=>parseFloat(i.value)||0),1);
  const bF=md.fixos.filter(i=>i.active).sort((a,b)=>b.value-a.value).map(i=>{const cat=getCat(i.catId);return `<div class="bar-row"><div class="bar-lbl">${ico(cat.icon,11)}<span>${i.name}</span></div><div class="bar-track"><div class="bar-fill" style="width:${((parseFloat(i.value)||0)/maxF*100).toFixed(1)}%;background:#1D9E75;"></div></div><div class="bar-amt">${fmt(i.value)}</div></div>`;}).join('');
  const maxV=Math.max(...md.variaveis.map(i=>parseFloat(i.current)||0),1);
  const bV=md.variaveis.sort((a,b)=>b.current-a.current).map(i=>{const cat=getCat(i.catId);return `<div class="bar-row"><div class="bar-lbl">${ico(cat.icon,11)}<span>${i.name}</span></div><div class="bar-track"><div class="bar-fill" style="width:${((parseFloat(i.current)||0)/maxV*100).toFixed(1)}%;background:#BA7517;"></div></div><div class="bar-amt">${fmt(i.current)}</div></div>`;}).join('');
  return `<div class="sum-grid">
    <div><div class="card"><div class="card-head"><span class="card-title">Distribuição do salário</span></div>
      <div style="padding:14px;"><div class="chart-area"><canvas id="pieChart"></canvas></div><div class="pie-legend" id="pie-legend"></div></div>
      <div style="padding:0 15px 4px;"><div class="sum-row"><span class="sum-lbl">Salário</span><span class="sum-val">${fmt(sal)}</span></div><div class="sum-row"><span class="sum-lbl">(-) Gastos fixos</span><span class="sum-val">${fmt(fixT)}</span></div><div class="sum-row"><span class="sum-lbl">(-) Gastos variáveis</span><span class="sum-val">${fmt(varT)}</span></div><div class="sum-row"><span class="sum-lbl">(-) Poupança</span><span class="sum-val">${fmt(poupT)}</span></div></div>
      <div style="padding:4px 15px 15px;"><div class="save-box"><div><div class="save-lbl">Disponível para poupar</div><div class="save-big" style="color:${cCor}">${fmt(disp)}</div></div><div style="text-align:right;"><div class="save-lbl">do salário</div><div class="save-pct" style="color:${cCor}">${pct}%</div></div></div></div>
    </div></div>
    <div>
      <div class="card" style="margin-bottom:12px;"><div class="card-head"><span class="card-title">Fixos por item</span></div><div style="padding:10px 13px;">${bF||'<div class="empty"><p>Sem fixos.</p></div>'}</div></div>
      <div class="card" style="margin-bottom:12px;"><div class="card-head"><span class="card-title">Variáveis por item</span></div><div style="padding:10px 13px;">${bV||'<div class="empty"><p>Sem variáveis.</p></div>'}</div></div>
      <div class="card"><div class="card-head"><span class="card-title">Poupança deste mês</span></div><div style="padding:10px 13px;">
        <div class="bar-row"><div class="bar-lbl">${ico('i-plane',11)} Viagens</div><div class="bar-track"><div class="bar-fill" style="width:${disp>0?(pv/disp*100).toFixed(1):0}%;background:#378ADD;"></div></div><div class="bar-amt">${fmt(pv)}</div></div>
        <div class="bar-row"><div class="bar-lbl">${ico('i-shield',11)} Reserva</div><div class="bar-track"><div class="bar-fill" style="width:${disp>0?(pr/disp*100).toFixed(1):0}%;background:#1D9E75;"></div></div><div class="bar-amt">${fmt(pr)}</div></div>
        <div class="bar-row"><div class="bar-lbl">${ico('i-trending',11)} Investimentos</div><div class="bar-track"><div class="bar-fill" style="width:${disp>0?(pi/disp*100).toFixed(1):0}%;background:#BA7517;"></div></div><div class="bar-amt">${fmt(pi)}</div></div>
        <div class="bar-row" style="border-top:1px solid var(--border);padding-top:6px;margin-top:4px;"><div class="bar-lbl" style="font-weight:500;color:var(--text-1);">Saldo livre</div><div class="bar-track"><div class="bar-fill" style="width:${disp>0?(livre/disp*100).toFixed(1):100}%;background:#AAA;"></div></div><div class="bar-amt" style="font-weight:500;">${fmt(livre)}</div></div>
      </div></div>
    </div>
  </div>`;
}
function initPie(){
  setTimeout(()=>{
    const md=app.meses[mesAtual];if(!md)return;
    const sal=parseFloat(md.salario)||0;const fixT=md.fixos.filter(i=>i.active).reduce((s,i)=>s+(parseFloat(i.value)||0),0);const varT=md.variaveis.reduce((s,i)=>s+(parseFloat(i.current)||0),0);const poupT=(parseFloat(md.poupanca?.viagens)||0)+(parseFloat(md.poupanca?.reserva)||0)+(parseFloat(md.poupanca?.investimentos)||0);const livre=Math.max(0,sal-fixT-varT-poupT);
    const canvas=document.getElementById('pieChart');if(!canvas)return;
    if(pieChart){pieChart.destroy();pieChart=null;}
    pieChart=new Chart(canvas.getContext('2d'),{type:'doughnut',data:{labels:['Fixos','Variáveis','Poupança','Saldo'],datasets:[{data:[Math.round(fixT),Math.round(varT),Math.round(poupT),Math.round(livre)],backgroundColor:['#1D9E75','#BA7517','#378ADD','#B4B2A9'],borderWidth:0,hoverOffset:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed)}}},cutout:'64%'}});
    const total=fixT+varT+poupT+livre;const leg=document.getElementById('pie-legend');
    if(leg)leg.innerHTML=[{l:'Fixos',c:'#1D9E75',v:fixT},{l:'Variáveis',c:'#BA7517',v:varT},{l:'Poupança',c:'#378ADD',v:poupT},{l:'Saldo',c:'#B4B2A9',v:livre}].map(d=>`<span class="leg-item"><span class="leg-dot" style="background:${d.c}"></span>${d.l} — ${total>0?Math.round((d.v/total)*100):0}%</span>`).join('');
  },60);
}

// ═══ MÉTRICAS ═══
function atualizarSal(v){const md=app.meses[mesAtual];md.salario=parseFloat(v)||0;salvarDados();updMC();}
function updMC(){
  const md=app.meses[mesAtual];if(!md)return;
  const sal=parseFloat(md.salario)||0;const fixT=md.fixos.filter(i=>i.active).reduce((s,i)=>s+(parseFloat(i.value)||0),0);const varT=md.variaveis.reduce((s,i)=>s+(parseFloat(i.current)||0),0);const disp=Math.max(0,sal-fixT-varT);const pct=sal>0?Math.round((disp/sal)*100):0;const cls=pct>=20?'safe':pct>=5?'warn':'danger';
  setEl('mc-sal',fmt(sal));setEl('mc-fix',fmt(fixT));setEl('mc-var',fmt(varT));
  const de=document.getElementById('mc-disp');if(de){de.textContent=fmt(disp);de.className='mc-val '+cls;}
}

// ═══ TABS ═══
function trocarAba(aba){
  abaAtiva=aba;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',['fixos','variaveis','poupanca','resumo'][i]===aba));
  ['fixos','variaveis','poupanca','resumo'].forEach(p=>{const el=document.getElementById('panel-'+p);if(el)el.classList.toggle('active',p===aba);});
  if(aba==='resumo'){const el=document.getElementById('panel-resumo');if(el){el.innerHTML=rResumo();initPie();}}
  if(aba==='poupanca'){const el=document.getElementById('panel-poupanca');if(el)el.innerHTML=rPoupanca();}
}

// ═══ INIT ═══
async function init(){
  mesAtual=null;
  renderSidebar();
  document.getElementById('main').innerHTML=
    rDesktopHdr(false)+
    rMobHdr(false)+
    `<div class="home-empty">
      <div style="opacity:0.25;margin-bottom:14px;">${ico('i-cloud',44)}</div>
      <h2 style="font-size:15px;font-weight:400;color:var(--text-2);">Carregando dados...</h2>
      <p style="font-size:13px;color:var(--text-3);margin-top:4px;">Buscando histórico no Gist</p>
    </div>`;
  await carregarGist();
  renderSidebar();
  renderMain();
}
init();
</script>
